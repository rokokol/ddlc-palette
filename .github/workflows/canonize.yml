name: canonize

# Re-reads ddlc.moe every week and opens a pull request when the site has drifted away from
# what is committed. Separate from the main check on purpose: this one depends on a
# third-party site being up, so its failures say nothing about the code
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31

      # canonize.sh rewrites palette.json and regenerates dist/ itself, so this refreshes
      # the assets as well as the numbers
      - name: re-read the site
        run: |
          cp palette.json /tmp/committed.json
          # It says on stderr when a bucket has no commonest shade and it averaged instead
          nix develop -c ./canonize.sh

      - name: open a pull request if it drifted
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet; then
            echo "palette.json and dist/ still match ddlc.moe"
            exit 0
          fi
          git diff --stat

          # Which colour moved where and by which method, so the notification alone says whether
          # this needs a look. The method is half the news: a colour that slid from mode to mean
          # means the site stopped painting that region flat, which no hex diff would say
          flat='[to_entries[] | select(.key != "meta" and .key != "base16") | .value | to_entries[]
                  | {key, value: "\(.value.hex) (\(.value.method))"}] | from_entries'
          table=$(jq -rn \
            --argjson a "$(jq -c "$flat" /tmp/committed.json)" \
            --argjson b "$(jq -c "$flat" palette.json)" '
              (($a | keys) + ($b | keys) | unique)[]
              | select($a[.] != $b[.])
              | "| `\(.)` | \($a[.] // "not in the palette") | \($b[.] // "gone") |"')
          if [ -n "$table" ]; then
            summary=$(printf '| colour | committed | measured now |\n| --- | --- | --- |\n%s\n' "$table")
          else
            summary="No hex changed — only \`dist/\` drifted, so \`generate.sh\` output moved without a measurement moving."
          fi

          branch=canonize/$(date -u +%Y-%m-%d)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -qam "$(printf 'canonize: ddlc.moe drifted\n\n%s\n' "$summary")"
          git push -f origin "$branch"
          # A colour change wants a human eye on the diff, so never push straight to master
          body=$(printf '`canonize.sh` re-read ddlc.moe and the measurements no longer match what is committed.\n\n%s\nEither the site changed or a measurement did — the run log says which buckets had no commonest shade and were averaged. Check the diff before merging.\n' "$summary")
          if [ "$(gh pr list --head "$branch" --state open --json number --jq length)" = 0 ]; then
            gh pr create --head "$branch" --title "canonize: ddlc.moe drifted" --body "$body"
          else
            gh pr edit "$branch" --body "$body"
            echo "a pull request for $branch is already open — force-pushed onto it"
          fi
